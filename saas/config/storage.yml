test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage/files") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage", Rails.env, "files") %>

devminio:
  service: S3
  bucket: fizzy-dev-activestorage
  endpoint: "http://minio.fizzy.localhost:39000"
  force_path_style: true
  request_checksum_calculation: when_required # default is when_supported with CRC64NVME checksum which FlashBlade doesn't support
  response_checksum_validation: when_required # default is when_supported with CRC64NVME checksum which FlashBlade doesn't support
  region: us-east-1 # default region required for signer
  access_key_id: minioadmin
  secret_access_key: minioadmin

# Each environment needs its own bucket and credentials scoped to that bucket.
# See docs/saas-storage-tls.md before deploying with an internal CA or migrating beta.
purestorage:
  service: S3WithDirectEndpoints
  bucket: fizzy-<%= Rails.env %>-activestorage
  endpoint: "https://storage.basecamp.com"
  direct_upload_endpoint: "https://storage.basecamp.com"
  ssl_verify_peer: true
  ssl_ca_bundle: <%= ENV["ACTIVE_STORAGE_SSL_CA_BUNDLE"]&.to_json %>
  force_path_style: true
  request_checksum_calculation: when_required # default is when_supported with CRC64NVME checksum which FlashBlade doesn't support
  response_checksum_validation: when_required # default is when_supported with CRC64NVME checksum which FlashBlade doesn't support
  region: us-east-1 # default region required for signer
  access_key_id: <%= ENV["ACTIVE_STORAGE_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["ACTIVE_STORAGE_SECRET_ACCESS_KEY"] %>
  # Write-only (s3:PutObject) user for presigning browser direct uploads.
  direct_upload_access_key_id: <%= ENV["ACTIVE_STORAGE_DIRECT_UPLOAD_ACCESS_KEY_ID"] %>
  direct_upload_secret_access_key: <%= ENV["ACTIVE_STORAGE_DIRECT_UPLOAD_SECRET_ACCESS_KEY"] %>
