default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Keep provider waits away from normal jobs. Add new normal queues here.
    - queues: [ "ai_suggestions" ]
      threads: 1
      processes: 1
      polling_interval: 0.1
    - queues: [ "default", "solid_queue_recurring", "backend", "webhooks", "incineration" ]
      threads: 3
      processes: <%= Integer(ENV.fetch("JOB_CONCURRENCY") { Concurrent.physical_processor_count }) %>
      polling_interval: 0.1

development: *default
test: *default
beta: *default
staging: *default
production: *default
